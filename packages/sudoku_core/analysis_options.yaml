# sudoku_core lint 基线（纯 Dart，零 Flutter 依赖）
#
# ⚠️ 分析器本身无"禁止某个 import"的规则，
#    禁 flutter / dart:ui / dart:io / print 由 tools/ci/check_layering.dart 静态扫描保证。
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - '**/build/**'
    - '**/.dart_tool/**'
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_relative_lib_imports
    - prefer_single_quotes
    - unnecessary_brace_in_string_interps
    - avoid_print
