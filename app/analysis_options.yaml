# app lint 基线（Flutter）
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'lib/l10n/generated/**'
    - '**/build/**'
    - '**/.dart_tool/**'
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_relative_lib_imports
    - prefer_single_quotes
    - unnecessary_brace_in_string_interps
    - use_super_parameters
